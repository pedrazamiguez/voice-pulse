server:
  port: 8082

spring:
  application:
    name: routing-handoff-service
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/voicepulse}
    username: ${POSTGRES_USER:voicepulse}
    password: ${POSTGRES_PASSWORD:voicepulse}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${POSTGRES_POOL_SIZE:20}
      minimum-idle: ${POSTGRES_MIN_IDLE:5}
      connection-timeout: ${POSTGRES_CONNECTION_TIMEOUT_MS:5000}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

voicepulse:
  routing:
    ticket-intent-topic: ${KAFKA_TICKET_INTENT_TOPIC:telephony.tickets.intent}
    call-control-topic: ${KAFKA_CALL_CONTROL_TOPIC:telephony.calls.control}
    consumer-group: ${ROUTING_KAFKA_CONSUMER_GROUP:routing-handoff-workers}
    operator-heartbeat-ttl: ${OPERATOR_HEARTBEAT_TTL:30s}
    operator-bridge-base-path: ${OPERATOR_BRIDGE_BASE_PATH:/ws/operators}
    max-queue-capacity: ${ROUTING_MAX_QUEUE_CAPACITY:1000}
    console:
      gateway-ws-base-url: ${GATEWAY_WS_BASE_URL:ws://localhost:8080}
      heartbeat-interval: ${OPERATOR_CONSOLE_HEARTBEAT_INTERVAL:10s}
      outbound-buffer-capacity: ${OPERATOR_CONSOLE_OUTBOUND_BUFFER_CAPACITY:256}
    persistence:
      enabled: ${ROUTING_PERSISTENCE_ENABLED:true}
    redis:
      enabled: ${ROUTING_REDIS_ENABLED:true}
      key-prefix: ${ROUTING_REDIS_KEY_PREFIX:voicepulse:routing}
      operation-timeout: ${ROUTING_REDIS_OPERATION_TIMEOUT:5s}
    kafka:
      enabled: ${ROUTING_KAFKA_ENABLED:true}
      concurrency: ${ROUTING_KAFKA_CONCURRENCY:3}
      auto-offset-reset: ${ROUTING_KAFKA_AUTO_OFFSET_RESET:earliest}
      send-timeout: ${ROUTING_KAFKA_SEND_TIMEOUT:5s}
      retry-backoff: ${ROUTING_KAFKA_RETRY_BACKOFF:500ms}
      max-retries: ${ROUTING_KAFKA_MAX_RETRIES:2}
      dlq-topic: ${ROUTING_KAFKA_DLQ_TOPIC:telephony.calls.dlq}
      topics:
        ticket-intent:
          partitions: ${ROUTING_KAFKA_TICKET_INTENT_PARTITIONS:6}
          replicas: ${ROUTING_KAFKA_TICKET_INTENT_REPLICAS:1}
        call-control:
          partitions: ${ROUTING_KAFKA_CALL_CONTROL_PARTITIONS:12}
          replicas: ${ROUTING_KAFKA_CALL_CONTROL_REPLICAS:1}
        dlq:
          partitions: ${ROUTING_KAFKA_DLQ_PARTITIONS:3}
          replicas: ${ROUTING_KAFKA_DLQ_REPLICAS:1}
