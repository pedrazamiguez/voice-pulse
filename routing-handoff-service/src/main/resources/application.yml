server:
  port: 8082

spring:
  application:
    name: routing-handoff-service
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/voicepulse}
    username: ${POSTGRES_USER:voicepulse}
    password: ${POSTGRES_PASSWORD:voicepulse}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${POSTGRES_POOL_SIZE:20}
      minimum-idle: ${POSTGRES_MIN_IDLE:5}
      connection-timeout: ${POSTGRES_CONNECTION_TIMEOUT_MS:5000}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

voicepulse:
  routing:
    ticket-intent-topic: ${KAFKA_TICKET_INTENT_TOPIC:telephony.tickets.intent}
    call-control-topic: ${KAFKA_CALL_CONTROL_TOPIC:telephony.calls.control}
    consumer-group: ${ROUTING_KAFKA_CONSUMER_GROUP:routing-handoff-workers}
    operator-heartbeat-ttl: ${OPERATOR_HEARTBEAT_TTL:30s}
    operator-bridge-base-path: ${OPERATOR_BRIDGE_BASE_PATH:/ws/operators}
    max-queue-capacity: ${ROUTING_MAX_QUEUE_CAPACITY:1000}
    persistence:
      enabled: ${ROUTING_PERSISTENCE_ENABLED:true}
    redis:
      enabled: ${ROUTING_REDIS_ENABLED:true}
      key-prefix: ${ROUTING_REDIS_KEY_PREFIX:voicepulse:routing}
      operation-timeout: ${ROUTING_REDIS_OPERATION_TIMEOUT:5s}
