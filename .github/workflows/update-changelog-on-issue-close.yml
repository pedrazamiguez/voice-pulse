name: Update Changelog on Issue Close

on:
  issues:
    types: [closed]

permissions:
  contents: write

jobs:
  update-changelog:
    name: Append Issue to CHANGELOG.md
    if: github.event.issue.state_reason == 'completed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Update CHANGELOG.md via GitHub REST API
        uses: actions/github-script@v7
        with:
          script: |
            const { run } = require('./.github/scripts/update-changelog.js');
            await run({ github, context, core });
