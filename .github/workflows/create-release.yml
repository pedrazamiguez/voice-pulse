name: Publish Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  release:
    name: Build, Verify, Tag & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract Release Version
        id: get-version
        run: |
          VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Extracted version: $VERSION"
          if [[ "$VERSION" =~ -SNAPSHOT$ ]]; then
            echo "::error::Branch 'main' version contains -SNAPSHOT ($VERSION). Cannot publish release from SNAPSHOT."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check Existing Git Tag
        id: check-tag
        run: |
          TAG="v${{ steps.get-version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on remote. Skipping release publishing."
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Multi-Module Build & ArchUnit Gates
        if: steps.check-tag.outputs.tag_exists == 'false'
        run: |
          ./mvnw clean verify -Dio.netty.leakDetection.level=PARANOID

      - name: Generate Structured Release Notes
        if: steps.check-tag.outputs.tag_exists == 'false'
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.get-version.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const { extractReleaseNotes } = require('./.github/scripts/release-utils.js');
            const version = process.env.RELEASE_VERSION;
            const changelogContent = fs.existsSync('CHANGELOG.md') ? fs.readFileSync('CHANGELOG.md', 'utf8') : '';
            let notes = extractReleaseNotes(changelogContent, version);

            if (!notes) {
              notes = `### VoicePulse Release v${version}\n\nAutomated production release.`;
            }

            const releaseNotes = `## What's Changed in VoicePulse v${version}\n\n${notes}\n\n---\n*Published on ${new Date().toISOString().split('T')[0]} from commit \`${context.sha.substring(0, 7)}\`.*`;
            fs.writeFileSync('RELEASE_NOTES.md', releaseNotes, 'utf8');
            core.info(`Generated RELEASE_NOTES.md for v${version}:\n${releaseNotes}`);

      - name: Create and Push Annotated Git Tag
        if: steps.check-tag.outputs.tag_exists == 'false'
        run: |
          TAG="v${{ steps.get-version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Publish GitHub Release
        if: steps.check-tag.outputs.tag_exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get-version.outputs.version }}
          name: VoicePulse v${{ steps.get-version.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
