name: Enforce Branch Naming & Targets

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  enforce-branch-rules:
    name: Validate Branch & Target Invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Branch and Target Rule
        uses: actions/github-script@v7
        with:
          script: |
            const { validateBranchTarget } = require('./.github/scripts/release-utils.js');
            const headRef = context.payload.pull_request.head.ref;
            const baseRef = context.payload.pull_request.base.ref;
            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            core.info(`Validating PR #${prNumber}: ${headRef} -> ${baseRef}`);

            const result = validateBranchTarget(headRef, baseRef);

            if (!result.valid) {
              core.setFailed(`Branch Enforcement Failed: ${result.error}`);
              return;
            }

            core.info(`✅ Branch rules satisfied for '${headRef}' -> '${baseRef}'.`);

            if (result.labels && result.labels.length > 0) {
              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: prNumber,
                  labels: result.labels
                });
                core.info(`Applied label(s): ${result.labels.join(', ')}`);
              } catch (err) {
                core.warning(`Failed to auto-apply labels: ${err.message}`);
              }
            }
