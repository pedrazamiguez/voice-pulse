name: Cancel Stale PR Runs

on:
  pull_request:
    types: [closed]

permissions:
  actions: write
  pull-requests: read

jobs:
  cancel-stale-runs:
    name: Cancel Queued & Running PR Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Cancel In-Flight Workflows for Closed PR
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = context.payload.pull_request?.head?.sha;
            const prNumber = context.payload.pull_request?.number;

            if (!headSha) {
              core.info('No head SHA found in pull_request payload. Exiting.');
              return;
            }

            core.info(`PR #${prNumber} closed. Checking for in-flight workflows matching head SHA ${headSha}...`);

            const targetWorkflows = [
              'build-and-test.yml',
              'static-analysis.yml',
              'coverage-and-architecture.yml',
              'sonar.yml',
              'enforce-branch-naming.yml'
            ];

            for (const status of ['queued', 'in_progress']) {
              try {
                const response = await github.rest.actions.listWorkflowRunsForRepo({
                  owner,
                  repo,
                  status,
                  head_sha: headSha
                });

                const runs = response.data.workflow_runs || [];
                core.info(`Found ${runs.length} ${status} workflow runs for head SHA ${headSha}.`);

                for (const run of runs) {
                  const workflowFilename = run.path ? run.path.split('/').pop() : '';
                  if (targetWorkflows.includes(workflowFilename) || targetWorkflows.includes(run.name)) {
                    core.info(`Cancelling workflow run #${run.id} (${run.name || workflowFilename})`);
                    try {
                      await github.rest.actions.cancelWorkflowRun({
                        owner,
                        repo,
                        run_id: run.id
                      });
                      core.info(`Cancelled run #${run.id} successfully.`);
                    } catch (cancelErr) {
                      core.warning(`Could not cancel run #${run.id}: ${cancelErr.message}`);
                    }
                  }
                }
              } catch (listErr) {
                core.warning(`Error fetching ${status} runs: ${listErr.message}`);
              }
            }
