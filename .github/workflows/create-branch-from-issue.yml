name: Create Branch From Issue

on:
  issues:
    types: [opened, labeled]

concurrency:
  group: create-branch-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-branch:
    name: Provision Branch
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.branch-meta.outputs.branch_name }}
      base_branch: ${{ steps.branch-meta.outputs.base_branch }}
      is_release: ${{ steps.branch-meta.outputs.is_release }}
      is_created: ${{ steps.branch-meta.outputs.is_created }}
    steps:
      - name: Calculate Branch Metadata & Provision Ref
        id: branch-meta
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN || secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            // Extract complete collection of label names across both 'opened' and 'labeled' events
            const rawLabels = [];
            if (context.payload.issue && Array.isArray(context.payload.issue.labels)) {
              rawLabels.push(...context.payload.issue.labels.map(l => typeof l === 'string' ? l : (l && l.name ? l.name : '')));
            }
            if (context.payload.label && context.payload.label.name) {
              rawLabels.push(context.payload.label.name);
            }
            const labelNames = [...new Set(rawLabels.filter(Boolean))];

            let targetLabel = null;
            let prefix = '';
            let baseBranch = 'develop';
            let isRelease = false;

            // Prioritized label matching
            if (labelNames.includes('release')) {
              targetLabel = 'release';
              prefix = 'release/';
              baseBranch = 'develop';
              isRelease = true;
            } else if (labelNames.includes('hotfix')) {
              targetLabel = 'hotfix';
              prefix = 'hotfix/';
              baseBranch = 'main';
            } else if (labelNames.includes('bug')) {
              targetLabel = 'bug';
              prefix = 'bugfix/';
              baseBranch = 'develop';
            } else if (labelNames.includes('refactor')) {
              targetLabel = 'refactor';
              prefix = 'refactor/';
              baseBranch = 'develop';
            } else if (labelNames.includes('internal')) {
              targetLabel = 'internal';
              prefix = 'internal/';
              baseBranch = 'develop';
            } else {
              const featureLabel = labelNames.find(l =>
                ['enhancement', 'feature', 'ci-cd', 'tooling', 'architecture', 'ai-workflow', 'documentation'].includes(l)
              );
              if (featureLabel) {
                targetLabel = featureLabel;
                prefix = 'feature/';
                baseBranch = 'develop';
              }
            }

            if (!targetLabel) {
              core.info(`No triggering labels found in [${labelNames.join(', ')}]. Skipping branch provisioning.`);
              core.setOutput('is_created', 'false');
              return;
            }

            core.info(`Triggered branch provisioning via label '${targetLabel}' (action: ${context.payload.action}).`);

            const issueNumber = context.payload.issue.number;
            const rawTitle = context.payload.issue.title;

            // 1. Remove bracketed prefixes (e.g. [VP-08], [EPIC-01])
            let cleaned = rawTitle.replace(/^\[[^\]]+\]\s*/, '');
            // 2. Remove Conventional Commit prefix (e.g. feat(core):, ci:, fix:)
            cleaned = cleaned.replace(/^[a-z]+(\([a-z0-9_-]+\))?:\s*/i, '');
            // 3. Lowercase and replace non-alphanumeric characters with hyphens
            let slug = cleaned.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
            // 4. Truncate slug to 30 characters and trim trailing hyphens
            slug = slug.substring(0, 30).replace(/-+$/, '');

            const branchName = `${prefix}VP-${issueNumber}-${slug}`;
            core.info(`Target branch name: ${branchName} from base: ${baseBranch}`);

            core.setOutput('branch_name', branchName);
            core.setOutput('base_branch', baseBranch);
            core.setOutput('is_release', isRelease ? 'true' : 'false');

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Check if branch already exists
            try {
              await github.rest.git.getRef({
                owner,
                repo,
                ref: `heads/${branchName}`
              });
              core.info(`Branch '${branchName}' already exists. Skipping creation.`);
              core.setOutput('is_created', 'false');
              return;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            // Retrieve base branch head SHA
            const baseRef = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${baseBranch}`
            });
            const sha = baseRef.data.object.sha;

            // Create branch ref with idempotent concurrency error handling
            try {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${branchName}`,
                sha
              });

              core.info(`Branch '${branchName}' created successfully.`);
              core.setOutput('is_created', 'true');

              // Post comment on issue
              const branchUrl = `https://github.com/${owner}/${repo}/tree/${branchName}`;
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: `🚀 Automated branch [\`${branchName}\`](${branchUrl}) successfully provisioned from \`${baseBranch}\` for #${issueNumber}.`
              });
            } catch (error) {
              if (error.status === 422) {
                const errorMsg = error.message || (error.response && error.response.data && error.response.data.message) || 'Reference already exists';
                core.info(`Branch '${branchName}' already exists concurrently (HTTP 422: ${errorMsg}). Skipping ref creation.`);
                core.setOutput('is_created', 'false');
                return;
              }
              throw error;
            }

      - name: Checkout Release Branch
        if: steps.branch-meta.outputs.is_release == 'true' && steps.branch-meta.outputs.is_created == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch-meta.outputs.branch_name }}
          token: ${{ secrets.PAT_TOKEN || secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        if: steps.branch-meta.outputs.is_release == 'true' && steps.branch-meta.outputs.is_created == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Strip SNAPSHOT & Stamp CHANGELOG
        if: steps.branch-meta.outputs.is_release == 'true' && steps.branch-meta.outputs.is_created == 'true'
        run: |
          ./mvnw versions:set -DremoveSnapshot=true -DgenerateBackupPoms=false
          VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          TODAY=$(date -u +'%Y-%m-%d')

          # Update CHANGELOG.md using release-utils stampChangelogRelease
          VERSION="$VERSION" TODAY="$TODAY" node -e '
            const fs = require("fs");
            const { stampChangelogRelease } = require("./.github/scripts/release-utils.js");
            if (fs.existsSync("CHANGELOG.md")) {
              const content = fs.readFileSync("CHANGELOG.md", "utf8");
              const result = stampChangelogRelease(content, process.env.VERSION, process.env.TODAY);
              if (result.modified) {
                fs.writeFileSync("CHANGELOG.md", result.content, "utf8");
              }
            }
          '

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): prepare release v$VERSION"
          git push origin ${{ steps.branch-meta.outputs.branch_name }}

      - name: Auto-Create Release PR Targeting Main
        if: steps.branch-meta.outputs.is_release == 'true' && steps.branch-meta.outputs.is_created == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN || secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const branchName = '${{ steps.branch-meta.outputs.branch_name }}';
            const issueNumber = context.payload.issue.number;
            const rawTitle = context.payload.issue.title;
            const cleanedTitle = rawTitle.replace(/^\[[^\]]+\]\s*/, '');
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const isMajor = /\[x\]\s*Major Release/i.test(context.payload.issue.body || '');

            const prTitle = cleanedTitle.endsWith(`(#${issueNumber})`)
              ? cleanedTitle
              : `${cleanedTitle} (#${issueNumber})`;

            const pr = await github.rest.pulls.create({
              owner,
              repo,
              title: prTitle,
              head: branchName,
              base: 'main',
              body: `Automated release pull request for #${issueNumber}.\n\nCloses #${issueNumber}`
            });

            const prLabels = ['release'];
            if (isMajor) {
              prLabels.push('major');
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pr.data.number,
              labels: prLabels
            });

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: `📋 Automated Release PR [#${pr.data.number}](${pr.data.html_url}) opened targeting \`main\`.`
            });
