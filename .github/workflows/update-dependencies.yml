name: Update Dependencies

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  update-dependencies:
    name: Update Project Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Grant execute permission for Maven Wrapper
        run: chmod +x ./mvnw

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update Dependencies and Process PR
        run: |
          echo "🔍 Scanning and updating dependency versions in pom.xml..."
          ./mvnw versions:update-properties -DallowMajorUpdates=false
          ./mvnw spotless:apply -q

          if git diff --quiet pom.xml; then
            echo "✅ All dependencies are already up to date. No changes needed."
            exit 0
          fi

          echo "📦 Dependency updates detected in pom.xml."

          # Verify project integrity before committing
          echo "⏳ Verifying project compilation..."
          ./mvnw test-compile -q

          BRANCH_NAME="internal/dependency-updates"

          git checkout -B "$BRANCH_NAME"
          git add pom.xml
          git commit -m "chore(deps): update project dependencies to latest stable versions"
          git push origin "$BRANCH_NAME" --force

          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base develop --state open --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            echo "🔄 Existing open PR #$EXISTING_PR refreshed with latest updates."
          else
            PR_BODY=$(cat <<'EOF'
          ### 🤖 Automated Dependency Updates

          This pull request was automatically generated by the [update-dependencies](https://github.com/${{ github.repository }}/actions/workflows/update-dependencies.yml) workflow.

          It updates project dependency and build plugin versions declared in the root `pom.xml` properties using `versions-maven-plugin` (restricted to stable minor/patch releases and formatted via Spotless).

          ### 📋 Checklist for Reviewers
          - [ ] Verify that all CI checks (compilation, unit tests, static analysis, ArchUnit) pass.
          - [ ] Review updated dependency version properties for potential breaking changes or deprecations.
          - [ ] Run `make pre-pr` and `make test` locally if necessary.
          EOF
          )

            gh pr create \
              --base develop \
              --head "$BRANCH_NAME" \
              --title "chore(deps): update project dependencies" \
              --body "$PR_BODY" \
              --label "tooling,ci-cd"

            echo "🚀 Successfully created pull request for dependency updates."
          fi
