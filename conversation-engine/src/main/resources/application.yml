spring:
  application:
    name: conversation-engine
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

voicepulse:
  kafka:
    topics:
      raw:
        name: telephony.calls.raw
        partitions: 12
        replication-factor: 1
        retention: 1h
        segment-bytes: 52428800
      control:
        name: telephony.calls.control
        partitions: 12
        replication-factor: 1
        retention: 1h
      tickets-intent:
        name: telephony.tickets.intent
        partitions: 6
        replication-factor: 1
        retention: 168h
      dlq:
        name: telephony.calls.dlq
        partitions: 3
        replication-factor: 1
        retention: 336h
  conversation:
    kafka:
      enabled: true
      consumer-group: conversation-engine-workers
      concurrency: 3
      auto-offset-reset: earliest
      worker-pool-size: 8
    mcp:
      crm-base-url: ${MCP_CRM_BASE_URL:http://localhost:8091}
      ticket-base-url: ${MCP_TICKET_BASE_URL:http://localhost:8092}
      routing-base-url: ${MCP_ROUTING_BASE_URL:http://localhost:8093}
      connect-timeout: ${MCP_CONNECT_TIMEOUT:2s}
      request-timeout: ${MCP_REQUEST_TIMEOUT:5s}
